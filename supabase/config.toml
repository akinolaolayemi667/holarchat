# Minimal Supabase CLI project config for local migrations/tests.
# Generate a full config with `supabase init` if you prefer the default scaffold.

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://holarchat.vercel.app/auth/callback",
]
